<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Discord Clone{% endblock %}</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --dc-dark: #1e1f22;
            --dc-darker: #2b2d31;
            --dc-sidebar: #313338;
            --dc-accent: #5865f2;
            --dc-text: #dcddde;
            --dc-muted: #949ba4;
        }
        body {
            background-color: var(--dc-dark);
            color: var(--dc-text);
            font-family: 'Segoe UI', sans-serif;
        }
        .sidebar {
            background-color: var(--dc-darker);
            height: 100vh;
            overflow-y: auto;
        }
        .channel-list {
            background-color: var(--dc-sidebar);
            height: 100vh;
            overflow-y: auto;
        }
        .btn-accent {
            background-color: var(--dc-accent);
            color: white;
            border: none;
        }
        .btn-accent:hover {
            background-color: #4752c4;
            color: white;
        }
        a { color: var(--dc-accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--dc-darker); }
        ::-webkit-scrollbar-thumb { background: var(--dc-dark); border-radius: 3px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if messages %}
        <div class="position-fixed top-0 end-0 p-3" style="z-index: 9999;">
            {% for message in messages %}
                <div class="toast show align-items-center text-white 
                    {% if message.tags == 'error' %}bg-danger
                    {% elif message.tags == 'success' %}bg-success
                    {% else %}bg-secondary{% endif %} border-0 mb-2" role="alert">
                    <div class="d-flex">
                        <div class="toast-body">{{ message }}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}{% endblock %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
