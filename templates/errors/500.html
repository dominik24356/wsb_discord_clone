{% extends 'base.html' %}
{% block title %}500 - Błąd serwera{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center px-3"
    style="background: linear-gradient(135deg, #1e1f22 0%, #2b2d31 100%);">
    <div class="text-center">
        <div class="position-relative d-inline-block mb-4">
            <h1 class="fw-bold mb-0"
                style="font-size: clamp(80px, 20vw, 140px);
                       background: linear-gradient(135deg, #ed4245, #c0392b);
                       -webkit-background-clip: text;
                       -webkit-text-fill-color: transparent;
                       background-clip: text;
                       line-height: 1;">500</h1>
            <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
                        width:120%;height:120%;background:radial-gradient(circle,rgba(237,66,69,0.15),transparent 70%);
                        pointer-events:none;border-radius:50%;"></div>
        </div>
        <h2 class="fw-bold mb-2" style="color:white;font-size:clamp(18px,4vw,28px);">
            Błąd serwera
        </h2>
        <p class="mb-4 mx-auto" style="color:#949ba4;max-width:400px;font-size:15px;">
            Coś poszło nie tak po naszej stronie. Spróbuj ponownie za chwilę.
        </p>
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a href="{% url 'chat:index' %}" class="btn btn-accent px-4 py-2">
                <i class="bi bi-hash me-2"></i>Wróć do chatu
            </a>
            <button onclick="window.location.reload()" class="btn px-4 py-2"
                style="background:#2b2d31;color:white;border:1px solid #404249;">
                <i class="bi bi-arrow-clockwise me-2"></i>Odśwież
            </button>
        </div>
        <p class="mt-5" style="color:#404249;font-size:12px;">
            Błąd 500 — wewnętrzny błąd serwera
        </p>
    </div>
</div>
{% endblock %}
