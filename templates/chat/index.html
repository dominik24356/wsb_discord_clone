{% extends 'base.html' %}
{% load chat_tags %}
{% block title %}Discord Clone{% endblock %}

{% block content %}
<div class="d-flex" style="height: 100vh; overflow: hidden;">
    
    <!-- LEWA KOLUMNA - lista kanałów -->
    {% sidebar %}

    <!-- PRAWA STRONA - główna treść -->
    <div class="d-flex flex-column flex-grow-1 align-items-center justify-content-center" style="background-color: #313338;">
        <i class="bi bi-hash" style="font-size: 64px; color: #949ba4;"></i>
        <h4 style="color: white;">Wybierz kanał</h4>
        <p style="color: #949ba4;">Wybierz kanał z listy po lewej stronie lub napisz do kogoś bezpośrednio.</p>
    </div>

</div>

<!-- Modal tworzenia kanału -->
<div id="createChannelModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:#313338; border-radius:8px; padding:24px; width:460px;">
        <h5 id="modalTitle" style="color:white;" class="mb-4">Utwórz kanał</h5>
        <form method="post" action="{% url 'chat:create_channel' %}">
            {% csrf_token %}
            <input type="hidden" name="channel_type" id="channelTypeInput" value="text">
            <div class="mb-4">
                <label style="color:#949ba4; font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:700;">
                    Nazwa kanału
                </label>
                <input type="text" name="name" class="form-control mt-2"
                    style="background:#1e1f22; border:none; color:white; padding:10px;"
                    placeholder="nowy-kanał" required>
            </div>
            <div class="mb-4">
                <label style="color:#949ba4; font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:700;">
                    Opis (opcjonalnie)
                </label>
                <input type="text" name="description" class="form-control mt-2"
                    style="background:#1e1f22; border:none; color:white; padding:10px;"
                    placeholder="Opis kanału">
            </div>
            <div class="d-flex justify-content-end gap-2">
                <button type="button" onclick="document.getElementById('createChannelModal').style.display='none'"
                    class="btn" style="color:white; background:none;">Anuluj</button>
                <button type="submit" class="btn btn-accent">Utwórz kanał</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function openCreateChannel(type) {
    document.getElementById('channelTypeInput').value = type;
    document.getElementById('modalTitle').textContent = 
        type === 'text' ? 'Utwórz kanał tekstowy' : 'Utwórz kanał głosowy';
    document.getElementById('createChannelModal').style.display = 'flex';
}
</script>
{% endblock %}
