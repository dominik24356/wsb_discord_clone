{% extends 'base.html' %}
{% block title %}DM - {{ other_user.username }}{% endblock %}

{% block content %}
<div class="d-flex" style="height: 100vh; overflow: hidden;">

    <div class="d-flex flex-column" style="width: 240px; min-width: 240px; background-color: #2b2d31;">
        <div class="p-3 border-bottom" style="border-color: #1e1f22 !important;">
            <a href="{% url 'chat:index' %}" style="color: #949ba4; text-decoration: none;">
                <i class="bi bi-arrow-left me-2"></i>Wróć do kanałów
            </a>
        </div>
    </div>

    <div class="flex-grow-1 d-flex align-items-center justify-content-center" style="background-color: #313338;">
        <div class="text-center">
            <i class="bi bi-slash-circle" style="font-size: 64px; color: #ed4245;"></i>
            <h4 class="mt-3" style="color: white;">Nie można otworzyć rozmowy</h4>
            <p style="color: #949ba4;">{{ reason }}</p>
            <a href="{% url 'chat:users_list' %}" class="btn btn-accent mt-2">
                Wróć do listy użytkowników
            </a>
        </div>
    </div>
</div>
{% endblock %}
