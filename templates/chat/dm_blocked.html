{% extends 'base.html' %}
{% load chat_tags %}
{% block title %}Zablokowana rozmowa{% endblock %}

{% block extra_css %}
<style>
@media (max-width: 768px) {
    #sidebar-toggle {
        display: flex !important;
        align-items: center;
        justify-content: center;
    }
    #sidebar-wrapper {
        position: fixed;
        left: -260px;
        top: 0;
        height: 100vh;
        height: 100dvh;
        z-index: 999;
        transition: left 0.3s ease;
        box-shadow: 4px 0 20px rgba(0,0,0,0.5);
    }
    #sidebar-wrapper.sidebar-open { left: 0; }
    #sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 998;
    }
    #sidebar-overlay.active { display: block; }
}

@keyframes pulse-red {
    0%, 100% { box-shadow: 0 0 0 0 rgba(237, 66, 69, 0.4); }
    50% { box-shadow: 0 0 0 20px rgba(237, 66, 69, 0); }
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
}
.blocked-icon {
    animation: pulse-red 2s infinite;
    border-radius: 50%;
}
.blocked-icon:hover {
    animation: shake 0.5s ease;
}
</style>
{% endblock %}

{% block content %}
<div class="d-flex" style="height: 100vh; height: 100dvh; overflow: hidden; position: relative;">

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <button id="sidebar-toggle" onclick="toggleSidebar()"
        style="display:none;position:fixed;top:10px;left:10px;z-index:1000;
               background:#5865f2;border:none;color:white;width:36px;height:36px;
               border-radius:8px;font-size:18px;cursor:pointer;">
        <i class="bi bi-list"></i>
    </button>

    <div id="sidebar-wrapper">
        {% sidebar %}
    </div>

    <div class="flex-grow-1 d-flex align-items-center justify-content-center"
        style="background-color: #313338; min-width: 0; padding: 20px;">
        <div class="text-center">

            <!-- Animowana ikona -->
            <div class="blocked-icon d-inline-flex align-items-center justify-content-center mb-4"
                style="width:100px;height:100px;background-color:#ed424520;border:2px solid #ed4245;">
                <i class="bi bi-slash-circle" style="font-size: 48px; color: #ed4245;"></i>
            </div>

            <h4 class="fw-bold mb-2" style="color: white;">Nie można otworzyć rozmowy</h4>
            <p class="mb-4" style="color: #949ba4; max-width: 300px; margin: 0 auto;">{{ reason }}</p>

            <div class="d-flex gap-3 justify-content-center flex-wrap">
                <a href="{% url 'chat:users_list' %}" class="btn btn-accent">
                    <i class="bi bi-people me-2"></i>Lista użytkowników
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function toggleSidebar() {
    document.getElementById('sidebar-wrapper').classList.toggle('sidebar-open');
    document.getElementById('sidebar-overlay').classList.toggle('active');
}
</script>
{% endblock %}
